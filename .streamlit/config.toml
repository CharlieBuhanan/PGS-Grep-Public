# Hide tracebacks from the browser; they expose file paths and code to anyone
# who triggers a crash on the public demo. Errors still reach the server logs.
[client]
showErrorDetails = "none"

[theme]
base = "light"

primaryColor = "#004085"

backgroundColor = "#FFFFFF"

secondaryBackgroundColor = "#F0F2F6"

textColor = "#262730"

# Use the locally-hosted "Roboto" family defined by the [[theme.fontFaces]]
# entries below (native custom-font support in modern Streamlit) instead of
# a generic keyword like "sans serif".
#
# Known trade-off: Streamlit resends this theme config, fontFaces included,
# on every script rerun (not just page load), and the frontend re-registers
# the @font-face rules each time, causing a brief flash back to the default
# font on interaction. This is a Streamlit frontend behavior, not something
# fixable from this config file; see the note in StreamlitGUI.py's module
# docstring. Accepted as-is so Roboto stays the source of truth here.
font = "Roboto"

# Each entry maps one weight/style of Roboto to its file in ./static/.
# enableStaticServing (below) exposes that folder at the URL path
# "app/static/<filename>", which is what these entries reference.
[[theme.fontFaces]]
family = "Roboto"
url = "app/static/Roboto-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/Roboto-Medium.ttf"
style = "normal"
weight = 500

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/Roboto-Bold.ttf"
style = "normal"
weight = 700

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/Roboto-Italic.ttf"
style = "italic"
weight = 400

[server]
enableStaticServing = true

# Rejects oversized uploads before they are buffered into memory; the in-app
# check runs too late to prevent the spike. Temporary limit for free-tier
# hosting. A local run can lift it without editing this file:
#   streamlit run StreamlitGUI.py --server.maxUploadSize=1000
# The in-app check reads this value back at runtime, so both layers stay in step.
maxUploadSize = 200